services:
  - type: web
    name: shl-recommender
    runtime: python
    plan: free
    buildCommand: pip install . && python -m scripts.build_index
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: PYTHONUNBUFFERED
        value: "1"
