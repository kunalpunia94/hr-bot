[project]
name = "shl-recommender"
version = "0.1.0"
description = "SHL Assessment Recommender — conversational agent over the SHL product catalog"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.30.6",
    "pydantic>=2.9,<3.0",
    "python-dotenv==1.0.1",
    "requests==2.32.3",
    "numpy==1.26.4",
    "sentence-transformers==3.0.1",
    "faiss-cpu==1.8.0",
    "groq>=1.2.0,<2.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
